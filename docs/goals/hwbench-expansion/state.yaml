tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    objective: Validate agreed implementation plan and define bounded worker packages with honest proof boundaries
    inputs:
      - AGENTS.md
      - hwbench/
      - tests/
      - README.md
      - docs/goals/hwbench-expansion/goal.md
    constraints:
      - Read-only
      - Commercial EDA unavailable; no fabricated product Tcl commands or actual PPA claims
      - Select coherent sequential vertical slices
    expected_output:
      - Decision
      - Exact first worker package
      - Required remaining slices and evidence
    receipt:
      result: done
      task_id: T001
      board_path: docs/goals/hwbench-expansion/state.yaml
      decision: approved
      full_outcome_complete: false
      rationale: The two-track plan matches the agreed scope and can progress without proprietary tools. Native reporting currently lacks planned subgroup denominators, difficulty and repeat diagnostics, so T002 is a useful executable first slice. Heavy support must distinguish real repository fixture execution from official CVDP preparation and externally executed results. EDA completion can mean a validated operational integration contract, but cannot mean validated vendor commands, synthesis estimates or measured PPA. Keep the packages sequential because their code ownership overlaps.
      evidence:
        - path: docs/goals/hwbench-expansion/state.yaml
          finding: T001 is active; all implementation tasks are queued with null receipts. The board explicitly prohibits completion from planning or mock evidence.
        - path: docs/goals/hwbench-expansion/goal.md
          finding: The charter requires working CLI paths, real RTL/git controls, pinned catalog checks, queue/cache/import fault tests and Korean guide updates.
        - path: hwbench/reporting.py
          finding: Global success uses planned_runs, but category success uses recorded rows. Reporting has no difficulty, planned task manifest or repeat consistency summaries. Native PASS evidence validation must be preserved.
        - path: hwbench/execution.py
          finding: run records planned_runs and repeats, but no complete task/repeat plan. Rows contain category, agent evidence and grading evidence.
        - path: hwbench/grader.py
          finding: Native grading produces independent compile/simulation evidence and snapshots; this evidence contract is not interchangeable with repository or imported upstream results.
        - source: Parent environment receipt
          finding: Existing 34 tests pass. Icarus, bubblewrap and open-source tools are available. Docker daemon and proprietary EDA are unavailable.
        - source: Parent CVDP schema receipt
          finding: Heavy context.commit identifies the sanitized runnable bundle baseline; origin.commit is different. Empty patch values are not reference solutions.
      worker_package:
        task_id: T002
        objective: 'Deliver an end-to-end native metrics extension: persist a complete task/repeat plan before execution, propagate declared difficulty without inventing ratings, report planned-denominator category/difficulty results, task-level repeat consistency, failure phases, measured generation/grading timing and usage availability. Expose these in summary JSON, HTML/Markdown, CSV and comparison output while preserving legacy result compatibility and existing native PASS evidence checks.'
        allowed_files:
          - hwbench/common.py
          - hwbench/execution.py
          - hwbench/grader.py
          - hwbench/reporting.py
          - hwbench/cli.py
          - tests/**
        implementation_contract:
          - Represent planned runs with unique task_id/repeat identities and task metadata; validate membership and consistency when the manifest exists. Persist the initial results before executing the first task.
          - Use the manifest for subgroup denominators and missing-run accounting. Legacy results without a manifest must explicitly retain unknown subgroup coverage rather than infer missing task classifications.
          - Treat absent difficulty as unknown. Keep category, difficulty and execution backend as separate concepts.
          - Report per-task passed/planned repeats and all-pass/never-pass/mixed outcomes with explicit incomplete coverage. Do not name repeated success pass@k or treat simulator seeds as independent tasks.
          - Derive failure phases from structured execution evidence. Preserve status and raw reason; unavailable evidence maps to unknown rather than a guessed phase.
          - Separate agent and grading elapsed times. Do not multiply shared compile timing by the number of seeds. Missing token/cost observations remain missing.
          - Maintain the current protocol/kind comparison boundary. Do not weaken native validation to accommodate future repository or EDA results.
          - Tests must cover omitted planned runs, legacy reports, invalid/duplicate plan identities, unknown difficulty, mixed repeat outcomes, infrastructure failures and absent usage.
        verify:
          - python3 -m unittest discover -s tests -v
          - python3 -m hwbench demo --help
          - Run the documented native demo into a new artifacts directory and regenerate report/compare outputs from its preserved results.
          - git diff --check
        stop_if:
          - Implementation requires changes outside allowed_files.
          - A proposed metric would require unrecorded evidence or reinterpret existing PASS evidence.
          - A failing existing test demonstrates a compatibility change that cannot be fixed within this package.
          - Another writer is modifying the same files.
      parallel_safety:
        safe: false
        reason: T002 through T005 overlap hwbench, tests and later integration files. Execute one write worker at a time; separate boards would not establish disjoint ownership.
      missing_evidence:
        - Implementation and current verification receipts for T002 through T005.
        - Real repository baseline, passing repair and failing repair execution evidence.
        - Official heavy bundle preparation/integrity evidence; full official evaluator execution is unavailable in the current environment.
        - EDA queue lifecycle, timeout, cache invalidation, export/import integrity and forged-evidence rejection tests.
        - Final integrated validation and independent full-outcome audit.
      required_board_updates:
        - task_id: T002
          update: Use the worker package above. Record before/after user-visible reporting evidence, not only test counts.
        - task_id: T003
          update: Define a separate repository execution/evidence contract instead of relaxing the native flat-RTL grader. Pin catalog revision and file hashes; validate task IDs and no-commercial selection. Materialize local git bundles using context.repo/context.commit, never origin.commit. Preserve upstream provenance and distinguish empty patch entries from golden solutions.
        - task_id: T003
          update: Require an immutable baseline, explicit modification allowlist, rejection of path escapes/symlinks and hidden trusted checks outside the agent workspace. Verify a real git/worktree plus Icarus positive/negative fixture. Provide operational official-heavy preparation and external-runner/result-import paths with expected-task accounting. A catalog plus mock import alone is insufficient. Record official Docker evaluation as unexecuted.
        - task_id: T004
          update: Use a separate EDA result schema and commands. Gate jobs on validated functional PASS snapshots; preserve source identity and source hashes. Distinguish fixture/mock, externally reported and locally executed evidence. Keep lint/Xprop outcomes separate from PPA and keep RTL estimates separate from synthesis measurements.
        - task_id: T004
          update: Specify wrapper argv/input/output contracts without invented vendor CLI or parsers. Fingerprint tool/version, wrapper, library, constraints, analysis stage, workload/activity and source inputs. Reject nonfinite metrics, invalid units and incomplete provenance for comparable measurements. Preserve raw reports and explicitly mark imported results as externally claimed.
        - task_id: T004
          update: Implement persistent resumable jobs with exclusive ownership, bounded execution, timeout/process-group termination, queue wait versus execution timing and total budget accounting. Cache only valid matching completed evidence; exclude infrastructure failures and prevent mock cache entries from satisfying measured requests. Export/import must verify hashes, job identity and safe paths.
        - task_id: T004
          update: Report planned, eligible, attempted and valid measured counts separately. Compare PPA only for matching task/workload/tool conditions and disclose unmatched or failed measurements. Do not rank successful survivors as though all planned submissions were measured.
        - task_id: T005
          update: Update bundle contents and offline validation for the new execution paths. Expand the single HTML guide with formulas, denominators, examples, matching rules and explicit real-versus-fixture boundaries; apply the requested Korean proofreading skill. Preserve fresh validation artifacts without overwriting prior evidence.
        - task_id: T999
          update: Audit every original outcome against executable receipts. Missing proprietary binaries are an acknowledged execution boundary, not a reason to stop implementation; actual proprietary measurements and official heavy scores must remain explicitly unverified.
