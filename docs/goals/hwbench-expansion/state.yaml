version: 2
goal:
  title: HWBench heavy evaluation and offline-ready EDA assessment
  slug: hwbench-expansion
  kind: existing_plan
  tranche: Implement both agreed evaluation tracks and all safe outside-company verification, with commercial execution explicitly unverified.
  status: done
  oracle:
    signal: Regression suite, real repository/RTL fixtures, pinned CVDP catalog audit, queue/cache/import fault tests, standalone report walkthrough
    cadence: after each vertical slice and final integration
    final_proof: Working CLI paths for base metrics, heavy repository evaluation, offline EDA job export/import and controlled wrapper execution; passing regression/integration and independent final audit
  intake:
    original_request: 한번에 goal로 구현/검증 진행해줘. 지금은 사외라서 EDA tool 사용 못하는거 감안해줘
    interpreted_outcome: Operational benchmark expansion with honest evidence for real RTL/repository checks versus mocked commercial EDA contracts
    input_shape: existing_plan
    audience: SoC HW IP engineers evaluating models and agents in an air-gapped network
    authority: requested
    proof_type: test
    completion_proof: All local implementation and validation complete; proprietary EDA execution marked unavailable rather than simulated as real measurements
    likely_misfire: Claiming mock PPA or toy repository smoke validates official heavy scores or real proprietary tools
    blind_spots_considered:
      - Commercial binaries/licenses/PDK are unavailable
      - CVDP heavy uses external git bundles and official Docker harness
      - Long tool runs require queue budgets, provenance-aware cache, and distinct infrastructure failures
      - No real model credentials supplied; validate adapters using controls without claiming model performance
    existing_plan_facts:
      - 'Track 1: no commercial EDA dependency; strengthen metrics and support heavy repository tasks'
      - 'Track 2: functional-pass submissions get synthesis/RTL-estimate PPA with RTLA/PowerPro and separate lint/Xprop quality results'
      - 'EDA costs: final submissions only, bounded concurrency, queue/execution time separation, deduplication, persistent evidence'
      - Retain offline stdlib baseline; keep official CVDP and native/adapted results separate
      - Preserve Korean single-HTML guide and user-requested humanize-korean proofreading
      - 'Mandatory: company execution has no external connectivity. All datasets, sanitized git bundles, evaluator sources, Docker images, Python/runtime and tool dependencies must be pre-staged and hash verified. Runtime commands never fetch, pull, install or fall back to external APIs. Internal model endpoints/license servers may be configured explicitly. Verify offline behavior and document connected preparation separately.'
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true
agents:
  scout: installed
  worker: installed
  judge: installed
visual_board:
  selected: local
  local:
